<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Gallery – STEAL A MONSTER</title>
  <script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/",
    "#shared/": "./shared/",
    "#server/": "./server/"
  }
}
</script>
  <style>
    html, body { margin: 0; height: 100%; background: #b9e3ff; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
    #bar button { font: 800 14px "Trebuchet MS", system-ui; padding: 6px 12px; border-radius: 10px; border: 3px solid #2a1a4a; background: #ffe14a; cursor: pointer; }
    #bar button.on { background: #ff7ab8; color: #fff; }
    #areas { display: inline-flex; gap: 4px; flex-wrap: wrap; }
    #areas a.on { background: #ff7ab8; color: #fff; }
    #bar a { font: 800 14px system-ui; padding: 6px 12px; border-radius: 10px; background: #fff; color: #2a1a4a; text-decoration: none; border: 3px solid #2a1a4a; }
  </style>
</head>
<body>
  <div id="bar">
    <a href="/">← Play</a>
    <button data-pose="idle" class="on">Idle</button>
    <button data-pose="move">Move</button>
    <button data-pose="quirk">Personality</button>
    <button data-pose="windup">Attack</button>
    <button data-pose="stunned">Stunned</button>
    <button data-pose="defeated">Defeated</button>
    <button data-pose="sleep">Sleep</button>
    <button data-pose="celebrate">Celebrate</button>
    <button data-pose="carried">Carried</button>
    <span id="areas"></span>
  </div>
  <canvas id="c"></canvas>
  <script type="module" src="client/gallery.js"></script>
</body>
</html>
